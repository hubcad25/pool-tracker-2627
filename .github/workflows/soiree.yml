name: soiree

# Notifs de soirée (pipeline/soiree.py) : la job passe aux 30 min et n'envoie que ce qui est dû.
# Le cron GitHub peut prendre des heures de retard sur une heure fixe : d'où ce passage fréquent.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Topic ntfy"
        type: choice
        options: [test, prod]
        default: test
      moment:
        description: "Forcer une notif (n'écrit aucun état)"
        type: choice
        options: [aucun, avant, soir, fin]
        default: aucun
      day:
        description: "Journée des matchs avec un moment forcé (AAAA-MM-JJ, vide = aujourd'hui)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: soiree
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Soirée
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          NTFY_TOPIC_TEST: ${{ secrets.NTFY_TOPIC_TEST }}
          NTFY_TOPIC_PROD: ${{ secrets.NTFY_TOPIC_PROD }}
          TARGET: ${{ inputs.target || vars.PIPELINE_TARGET || 'test' }}
          MOMENT: ${{ inputs.moment || 'aucun' }}
          DAY: ${{ inputs.day }}
        run: |
          args=(--target "$TARGET" --send)
          [ "$MOMENT" != "aucun" ] && args+=(--moment "$MOMENT")
          [ -n "$DAY" ] && args+=(--day "$DAY")
          uv run python -m pipeline.soiree "${args[@]}"

      # Seul l'état des notifs envoyées change (data/state/soirees.json) : la job quotidienne n'y touche pas
      - name: Commit état
        run: |
          git config user.name "pool-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/soirees.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "soirée: $(TZ=America/Toronto date '+%F %H:%M')"
          git pull --rebase
          git push
