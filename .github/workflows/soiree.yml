name: soiree

# Notifs de soirée (pipeline/soiree.py) : la job passe aux 30 min et n'envoie que ce qui est dû.
# Le cron GitHub peut prendre des heures de retard sur une heure fixe : d'où ce passage fréquent.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Topic ntfy"
        type: choice
        options: [test, prod]
        default: test
      moment:
        description: "Forcer une notif (n'écrit aucun état)"
        type: choice
        options: [aucun, avant, soir, fin]
        default: aucun
      day:
        description: "Journée des matchs avec un moment forcé (AAAA-MM-JJ, vide = aujourd'hui)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write   # relancer pages.yml après un commit (un push avec GITHUB_TOKEN ne déclenche rien)

concurrency:
  group: soiree
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Soirée
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          NTFY_TOPIC_TEST: ${{ secrets.NTFY_TOPIC_TEST }}
          NTFY_TOPIC_PROD: ${{ secrets.NTFY_TOPIC_PROD }}
          TARGET: ${{ inputs.target || vars.PIPELINE_TARGET || 'test' }}
          MOMENT: ${{ inputs.moment || 'aucun' }}
          DAY: ${{ inputs.day }}
        run: |
          args=(--target "$TARGET" --send)
          [ "$MOMENT" != "aucun" ] && args+=(--moment "$MOMENT")
          [ -n "$DAY" ] && args+=(--day "$DAY")
          uv run python -m pipeline.soiree "${args[@]}"

      # L'état des notifs envoyées (data/state/soirees.json, à la job de soirée seulement) et la soirée de la PWA
      # (data/today.json, aussi écrit par la job quotidienne : en cas de conflit, la version de ce run gagne)
      - name: Commit état
        id: commit
        run: |
          git config user.name "pool-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/soirees.json data/today.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "soirée: $(TZ=America/Toronto date '+%F %H:%M')"
          git pull --rebase || { git checkout --theirs data/today.json && git add data/today.json \
            && GIT_EDITOR=true git rebase --continue; }
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Redéployer la PWA
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "${{ github.repository }}"

      # Le cron de daily.yml saute parfois sa journée : passé midi, si dashboard.json n'est pas du jour et
      # qu'aucune job quotidienne n'a été lancée aujourd'hui, on la lance (avec le topic du cron)
      - name: Job quotidienne manquée
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
        run: |
          today=$(TZ=America/Toronto date +%F)
          if [ "$(jq -r .day data/dashboard.json)" = "$today" ] || [ "$(TZ=America/Toronto date +%-H)" -lt 12 ]; then exit 0; fi
          last=$(gh run list -R "${{ github.repository }}" -w daily.yml -L 1 --json createdAt -q '.[0].createdAt')
          if [ -n "$last" ] && [ "$(TZ=America/Toronto date -d "$last" +%F)" = "$today" ]; then exit 0; fi
          gh workflow run daily.yml --ref main -R "${{ github.repository }}" -f target="$TARGET"
